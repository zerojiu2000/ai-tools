        :root {

            --color-text-secondary: #4E5969;
            --color-text-tertiary: #86909C;
            --color-border-primary: #C9CDD4;
            --color-border-secondary: #E5E6EB;
            --color-border-tertiary: #F0F1F3;

        *{box-sizing:border-box;margin:0;padding:0}

        .logo{font-size:18px;font-weight:500;color:var(--color-text-primary);display:flex;align-items:center;gap:8px}

        .topbar-right{display:flex;align-items:center;gap:10px}
        .tb-btn{font-size:13px;color:var(--color-text-secondary);padding:6px 12px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:#fff;cursor:pointer}
        .hero{background:#fff;border-radius:16px;border:0.5px solid var(--color-border-tertiary);padding:28px 24px 24px;margin-bottom:20px;text-align:center}
        .hero-title{font-size:26px;font-weight:500;color:var(--color-text-primary);letter-spacing:-0.5px;margin-bottom:6px}
        .hero-sub{font-size:13px;color:var(--color-text-secondary);margin-bottom:18px}
        .search-wrap{display:flex;align-items:center;gap:8px;background:#F7F8FA;border:1px solid #E2E5EA;border-radius:10px;padding:10px 14px;max-width:480px;margin:0 auto}
        .search-wrap input{border:none;outline:none;background:transparent;font-size:14px;color:var(--color-text-primary);flex:1;font-family:var(--font-sans)}
        .search-wrap input::placeholder{color:#B0B5BF}
        .search-wrap i{font-size:17px;color:#B0B5BF}
        .stats-row{display:flex;gap:10px;margin-bottom:20px}
        .stat-card{flex:1;background:#fff;border-radius:12px;border:0.5px solid var(--color-border-tertiary);padding:14px 16px}
        .stat-num{font-size:22px;font-weight:500;color:var(--color-text-primary)}
        .stat-label{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
        .stat-icon{font-size:18px;margin-bottom:6px}
        .cats-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
        .cat{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:0.5px solid var(--color-border-tertiary);background:#fff;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}

        .cat-writing{color:#085041;border-color:#5DCAA5}.cat-writing.active{background:#E1F5EE;border-color:#1D9E75}
        .cat-image{color:#3C3489;border-color:#AFA9EC}.cat-image.active{background:#EEEDFE;border-color:#534AB7}
        .cat-video{color:#712B13;border-color:#F0997B}.cat-video.active{background:#FAECE7;border-color:#993C1D}
        .cat-code{color:#0C447C;border-color:#85B7EB}.cat-code.active{background:#E6F1FB;border-color:#185FA5}
        .cat-productivity{color:#633806;border-color:#EF9F27}.cat-productivity.active{background:#FAEEDA;border-color:#854F0B}
        .cat-search{color:#27500A;border-color:#97C459}.cat-search.active{background:#EAF3DE;border-color:#3B6D11}

        .section-title{font-size:15px;font-weight:500;color:var(--color-text-primary)}
        .section-count{font-size:12px;color:var(--color-text-tertiary)}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
        .card{background:#fff;border-radius:12px;border:0.5px solid var(--color-border-tertiary);padding:14px;cursor:pointer;text-decoration:none;display:block;transition:border-color .15s}
        .card:hover{border-color:var(--color-border-primary)}
        .card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
        .icon-box{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
        .icon-writing{background:#E1F5EE;color:#085041}
        .icon-image{background:#EEEDFE;color:#3C3489}
        .icon-video{background:#FAECE7;color:#712B13}
        .icon-code{background:#E6F1FB;color:#0C447C}
        .icon-productivity{background:#FAEEDA;color:#633806}
        .icon-search{background:#EAF3DE;color:#27500A}
        .badge{font-size:10px;padding:3px 7px;border-radius:5px;font-weight:500}
        .b-new{background:#E6F1FB;color:#0C447C}
        .b-free{background:#EAF3DE;color:#27500A}
        .b-hot{background:#FAECE7;color:#712B13}
        .card-name{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:3px}
        .card-desc{font-size:11px;color:var(--color-text-secondary);line-height:1.45;margin-bottom:8px}
        .card-footer{display:flex;align-items:center;justify-content:space-between}
        .card-comments{font-size:11px;color:var(--color-text-tertiary);display:flex;align-items:center;gap:3px}
        .card-visit{font-size:11px;color:#185FA5;display:flex;align-items:center;gap:3px}
        .no-res{text-align:center;padding:48px;color:var(--color-text-secondary);font-size:14px}

        .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:flex-start;justify-content:center;padding-top:40px;overflow-y:auto}

        .modal-hero{padding:24px 24px 20px}
        .modal-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
        .modal-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
        .modal-name{font-size:20px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
        .modal-cat{font-size:12px;color:var(--color-text-secondary)}
        .modal-desc{font-size:14px;color:var(--color-text-secondary);line-height:1.6;margin-bottom:18px}
        .modal-actions{display:flex;gap:10px}
        .btn-visit{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:10px;background:#378ADD;color:#fff;font-size:13px;font-weight:500;text-decoration:none;border:none;cursor:pointer}
        .btn-close-top{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:20px;padding:4px}
        .modal-divider{height:0.5px;background:var(--color-border-tertiary)}
        .modal-comments{padding:20px 24px}
        .comments-title{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:16px;display:flex;align-items:center;gap:6px}
        .comment-form{background:#F7F8FA;border-radius:12px;padding:14px;margin-bottom:18px}
        .form-row{display:flex;gap:8px;margin-bottom:10px}
        .form-row input{flex:1;border:0.5px solid var(--color-border-secondary);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;color:var(--color-text-primary);font-family:var(--font-sans);outline:none}
        .form-row input::placeholder{color:var(--color-text-tertiary)}
        .comment-textarea{width:100%;border:0.5px solid var(--color-border-secondary);border-radius:8px;padding:10px;font-size:13px;background:#fff;color:var(--color-text-primary);font-family:var(--font-sans);resize:none;outline:none;line-height:1.5;margin-bottom:10px}
        .comment-textarea::placeholder{color:var(--color-text-tertiary)}
        .form-bottom{display:flex;align-items:center;justify-content:space-between}
        .anon-note{font-size:11px;color:var(--color-text-tertiary);display:flex;align-items:center;gap:4px}
        .btn-submit{padding:7px 16px;border-radius:8px;background:#378ADD;color:#fff;font-size:13px;border:none;cursor:pointer;font-weight:500}
        .btn-submit:disabled{opacity:.5;cursor:not-allowed}
        .comments-list{display:flex;flex-direction:column;gap:12px}
        .comment-item{background:#F7F8FA;border-radius:10px;padding:12px 14px}
        .comment-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
        .comment-avatar{width:26px;height:26px;border-radius:50%;background:#E6F1FB;color:#0C447C;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}
        .comment-author{font-size:12px;font-weight:500;color:var(--color-text-primary)}
        .comment-time{font-size:11px;color:var(--color-text-tertiary);margin-left:auto}
        .comment-body{font-size:13px;color:var(--color-text-secondary);line-height:1.55}
        .comments-empty{text-align:center;padding:24px;color:var(--color-text-tertiary);font-size:13px}
        .supabase-note{background:#FAEEDA;border-radius:8px;padding:10px 12px;font-size:11px;color:#633806;margin-bottom:14px;display:flex;align-items:flex-start;gap:6px;line-height:1.5}
        .loading-dots{display:inline-flex;gap:3px}
        .loading-dots span{width:5px;height:5px;border-radius:50%;background:#B0B5BF;animation:dot .8s infinite}
        .loading-dots span:nth-child(2){animation-delay:.15s}
        .loading-dots span:nth-child(3){animation-delay:.3s}
        @keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}
        
        /* 新增：适配小屏幕 */
        @media (max-width: 480px) {
            .stats-row {
                flex-direction: column;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            .hero {
                padding: 20px 16px 16px;
            }
            .hero-title {
                font-size: 22px;
            }
        }

            {n:'Blackbox AI',c:'code',d:'代码搜索与生成工具，支持从视频中提取代码，免费使用。',u:'https://blackbox.ai',b:'free'},

            {n:'Julius AI',c:'code',d:'上传数据文件与AI对话分析，自动生成图表与洞察。',u:'https://julius.ai'},
            {n:'Whimsical AI',c:'code',d:'AI辅助流程图与思维导图生成，想法瞬间可视化。',u:'https://whimsical.com'},
            
            // 补充效率和搜索类工具（补全300个工具的基础）
            {n:'Notion',c:'productivity',d:'一站式工作空间，集成笔记、任务、数据库，AI增强版支持智能总结与创作。',u:'https://notion.so',b:'hot'},
            {n:'Obsidian',c:'productivity',d:'本地优先的知识管理工具，支持AI插件增强笔记能力，免费核心功能可用。',u:'https://obsidian.md',b:'free'},
            {n:'Raycast',c:'productivity',d:'macOS效率神器，AI助手集成，可替代Spotlight，自定义扩展丰富。',u:'https://raycast.com'},
            {n:'Alfred',c:'productivity',d:'macOS效率工具，AI workflow支持智能搜索与自动化。',u:'https://alfredapp.com'},
            {n:'Todoist AI',c:'productivity',d:'智能任务管理工具，AI可自动分类、优先级排序与生成任务描述。',u:'https://todoist.com'},
            {n:'ClickUp AI',c:'productivity',d:'全功能项目管理平台，AI辅助任务创建、总结与自动化工作流。',u:'https://clickup.com'},
            {n:'Notion AI',c:'productivity',d:'Notion内置AI助手，支持内容生成、总结、翻译与编辑。',u:'https://notion.so/ai'},
            {n:'ChatGPT for Google',c:'search',d:'浏览器扩展，在Google搜索结果中直接显示ChatGPT回答，提升搜索效率。',u:'https://chatgpt4google.com',b:'free'},
            {n:'Perplexity AI',c:'search',d:'AI驱动的搜索引擎，提供带引用的精准回答，支持多轮对话。',u:'https://perplexity.ai',b:'free'},
            {n:'You.com',c:'search',d:'AI增强搜索引擎，可直接在搜索页运行代码、生成图像。',u:'https://you.com',b:'free'},
            {n:'Metaphor',c:'search',d:'AI驱动的链接搜索引擎，基于语义理解推荐相关内容。',u:'https://metaphor.systems',b:'new'},
            {n:'Elicit',c:'search',d:'学术研究AI助手，搜索论文并总结关键发现，无需阅读全文。',u:'https://elicit.org',b:'free'}
        ];

        // 全局变量
        let currentCat = 'all';
        let currentTools = [...TOOLS];
        let activeToolId = '';

        // 初始化分类标签
        function initCats() {
            const catsRow = document.getElementById('catsRow');
            CATS.forEach(cat => {
                const catEl = document.createElement('div');
                catEl.className = `cat ${cat.cls} ${cat.id === 'all' ? 'active' : ''}`;
                catEl.innerHTML = `<i class="${cat.icon}" aria-hidden="true"></i> ${cat.label}`;
                catEl.setAttribute('data-cat', cat.id);
                catEl.onclick = () => switchCat(cat.id);
                catsRow.appendChild(catEl);
            });
        }

        // 切换分类
        function switchCat(catId) {
            if (currentCat === catId) return;
            
            // 更新分类样式
            document.querySelectorAll('.cat').forEach(el => {
                el.classList.remove('active');
                if (el.dataset.cat === catId) el.classList.add('active');
            });
            
            // 更新工具列表
            currentCat = catId;
            filterTools();
            
            // 更新标题和计数
            document.getElementById('sectionTitle').textContent = CATS.find(c => c.id === catId).label + '工具';
            document.getElementById('sectionCount').textContent = `共 ${currentTools.length} 个`;
        }

        // 筛选工具（分类+搜索）
        function filterTools() {
            const searchQuery = document.getElementById('sq').value.toLowerCase().trim();
            
            // 分类筛选
            if (currentCat === 'all') {
                currentTools = [...TOOLS];
            } else {
                currentTools = TOOLS.filter(tool => tool.c === currentCat);
            }
            
            // 搜索筛选
            if (searchQuery) {
                currentTools = currentTools.filter(tool => 
                    tool.n.toLowerCase().includes(searchQuery) || 
                    tool.d.toLowerCase().includes(searchQuery)
                );
            }
            
            // 渲染工具列表
            renderTools();
            
            // 更新计数
            document.getElementById('dispCount').textContent = currentTools.length;
            document.getElementById('sectionCount').textContent = `共 ${currentTools.length} 个`;
            
            // 显示/隐藏无结果提示
            document.getElementById('noRes').style.display = currentTools.length === 0 ? 'block' : 'none';
        }

        // 渲染工具卡片
        function renderTools() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            if (currentTools.length === 0) return;
            
            currentTools.forEach((tool, index) => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = 'javascript:void(0)';
                card.onclick = () => openModal(tool);
                
                // 徽章
                const badge = tool.b ? `<span class="badge b-${tool.b}">${tool.b === 'new' ? '新品' : tool.b === 'hot' ? '热门' : '免费'}</span>` : '';
                
                // 图标样式
                const iconStyle = `background:${ICON_COLOR[tool.c][0]};color:${ICON_COLOR[tool.c][1]}`;
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="icon-box icon-${tool.c}" style="${iconStyle}">
                            <i class="${ICON[tool.c]}" aria-hidden="true"></i>
                        </div>
                        ${badge}
                    </div>
                    <div class="card-name">${tool.n}</div>
                    <div class="card-desc">${tool.d.length > 40 ? tool.d.substring(0, 40) + '...' : tool.d}</div>
                    <div class="card-footer">
                        <span class="card-comments"><i class="ri-message-2-line" aria-hidden="true"></i> ${getCommentCount(tool.n)}</span>
                        <span class="card-visit"><i class="ri-external-link-line" aria-hidden="true"></i> 访问</span>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // 打开详情弹窗
        function openModal(tool) {
            activeToolId = tool.n;
            
            // 设置弹窗内容
            document.getElementById('mIcon').style = `background:${ICON_COLOR[tool.c][0]};color:${ICON_COLOR[tool.c][1]}`;
            document.getElementById('mIcon').innerHTML = `<i class="${ICON[tool.c]}" aria-hidden="true"></i>`;
            document.getElementById('mName').textContent = tool.n;
            document.getElementById('mCat').textContent = CAT_LABEL[tool.c];
            document.getElementById('mDesc').textContent = tool.d;
            document.getElementById('mLink').href = tool.u;
            
            // 设置徽章
            const badge = tool.b ? `<span class="badge b-${tool.b}">${tool.b === 'new' ? '新品' : tool.b === 'hot' ? '热门' : '免费'}</span>` : '';
            document.getElementById('mBadge').innerHTML = badge;
            
            // 加载评论
            loadComments();
            
            // 显示弹窗
            document.getElementById('overlay').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('overlay').classList.remove('open');
            document.body.style.overflow = '';
            activeToolId = '';
            
            // 清空表单
            document.getElementById('nickInput').value = '';
            document.getElementById('bodyInput').value = '';
        }

        // 处理弹窗外部点击关闭
        function handleOverlayClick(e) {
            if (e.target === document.getElementById('overlay')) {
                closeModal();
            }
        }

        // 加载评论
        function loadComments() {
            const commentsList = document.getElementById('commentsList');
            const commentCount = document.getElementById('commentCount');
            
            // 从本地存储获取评论
            const comments = JSON.parse(localStorage.getItem(`comments_${activeToolId}`)) || [];
            
            // 更新评论数
            commentCount.textContent = `(${comments.length})`;
            
            if (comments.length === 0) {
                commentsList.innerHTML = '<div class="comments-empty">暂无评论，快来抢沙发吧～</div>';
                return;
            }
            
            // 渲染评论
            commentsList.innerHTML = '';
            comments.forEach(comment => {
                const commentEl = document.createElement('div');
                commentEl.className = 'comment-item';
                
                // 生成头像文字（取昵称首字符或匿名）
                const avatarText = comment.nick ? comment.nick.substring(0, 1) : '匿';
                // 随机头像背景色
                const avatarColors = ['#E6F1FB', '#E1F5EE', '#EEEDFE', '#FAECE7', '#FAEEDA', '#EAF3DE'];
                const avatarColor = avatarColors[Math.floor(Math.random() * avatarColors.length)];
                
                commentEl.innerHTML = `
                    <div class="comment-meta">
                        <div class="comment-avatar" style="background:${avatarColor}">${avatarText}</div>
                        <div class="comment-author">${comment.nick || '匿名用户'}</div>
                        <div class="comment-time">${formatTime(comment.time)}</div>
                    </div>
                    <div class="comment-body">${comment.body}</div>
                `;
                
                commentsList.appendChild(commentEl);
            });
        }

        // 提交评论
        function submitComment() {
            const nick = document.getElementById('nickInput').value.trim();
            const body = document.getElementById('bodyInput').value.trim();
            
            if (!body) {
                alert('请输入评论内容');
                return;
            }
            
            // 创建评论对象
            const comment = {
                nick: nick,
                body: body,
                time: Date.now()
            };
            
            // 从本地存储获取现有评论
            const comments = JSON.parse(localStorage.getItem(`comments_${activeToolId}`)) || [];
            comments.unshift(comment); // 添加到开头
            
            // 保存到本地存储
            localStorage.setItem(`comments_${activeToolId}`, JSON.stringify(comments));
            
            // 重新加载评论
            loadComments();
            
            // 清空表单
            document.getElementById('nickInput').value = '';
            document.getElementById('bodyInput').value = '';
            
            // 更新工具卡片的评论数
            renderTools();
        }

        // 获取评论数
        function getCommentCount(toolName) {
            const comments = JSON.parse(localStorage.getItem(`comments_${toolName}`)) || [];
            return comments.length;
        }

        // 格式化时间
        function formatTime(timestamp) {
            const now = Date.now();
            const diff = now - timestamp;
            
            const minute = 60 * 1000;
            const hour = 60 * minute;
            const day = 24 * hour;
            
            if (diff < minute) {
                return '刚刚';
            } else if (diff < hour) {
                return `${Math.floor(diff / minute)}分钟前`;
            } else if (diff < day) {
                return `${Math.floor(diff / hour)}小时前`;
            } else {
                const date = new Date(timestamp);
                return `${date.getMonth() + 1}月${date.getDate()}日`;
            }
        }

        // 搜索框事件
        document.getElementById('sq').addEventListener('input', filterTools);

        // 初始化
        window.onload = function() {
            initCats();
            filterTools();
            
            // 按ESC关闭弹窗
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        };
    </script>
</body>
