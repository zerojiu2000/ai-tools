function getSampleComments(toolName){
  return SAMPLE_COMMENTS[toolName]||[];
}

async function fetchComments(toolId){
  if(!USE_SUPABASE){
    const local=localComments[toolId]||[];
    const sample=getSampleComments(toolId);
    return [...local,...sample];
  }
  try{
    if (supabaseClient) {
      const { data, error } = await supabaseClient
        .from('comments')
        .select('*')
        .eq('tool_id', toolId)
        .order('created_at', { ascending: false });
      if (error) return [];
      return data || [];
    }
    const res=await fetch(`${SUPABASE_URL}/rest/v1/comments?tool_id=eq.${encodeURIComponent(toolId)}&order=created_at.desc`,{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    return await res.json();
  }catch(e){return[];}
}

async function saveComment(toolId,nick,body){
  if(!USE_SUPABASE){
    if(!localComments[toolId])localComments[toolId]=[];
    localComments[toolId].unshift({nick:nick||'匿名用户',body,time:'刚刚'});
    return true;
  }
  try{
    if (supabaseClient) {
      const { error } = await supabaseClient
        .from('comments')
        .insert([{ tool_id: toolId, nickname: nick || '匿名用户', body, created_at: new Date().toISOString() }]);
      return !error;
    }
    const res=await fetch(`${SUPABASE_URL}/rest/v1/comments`,{
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({tool_id:toolId,nickname:nick||'匿名用户',body,created_at:new Date().toISOString()})
    });
    return res.ok;
  }catch(e){return false;}
}

function timeFmt(str){
  if(str&&(str.includes('前')||str==='刚刚'))return str;
  try{
    const d=new Date(str),now=new Date(),diff=Math.floor((now-d)/1000);
    if(diff<60)return '刚刚';
    if(diff<3600)return Math.floor(diff/60)+'分钟前';
    if(diff<86400)return Math.floor(diff/3600)+'小时前';
    return Math.floor(diff/86400)+'天前';
  }catch(e){return str||'';}
}

function initials(name){
  const n=name||'匿名';
  return n.length<=2?n:n.slice(0,2);
}

function renderComments(list){
  const el=document.getElementById('commentsList');
  document.getElementById('commentCount').textContent='('+list.length+')';
  if(!list.length){el.innerHTML='<div class="comments-empty"><i class="ti ti-message-off" style="font-size:20px;display:block;margin:0 auto 8px" aria-hidden="true"></i>还没有评论，来说第一个吧</div>';return;}
  el.innerHTML=list.map(c=>{
    const nick=c.nick||c.nickname||'匿名用户';
    const body=c.body||c.content||'';
    const t=timeFmt(c.time||c.created_at);
    return `<div class="comment-item">
      <div class="comment-meta">
        <div class="comment-avatar">${initials(nick)}</div>
        <span class="comment-author">${nick}</span>
        <span class="comment-time">${t}</span>
      </div>
      <div class="comment-body">${body}</div>
    </div>`;
  }).join('');
}

  curTool=tool;
  const [bg,fg]=ICON_COLOR[tool.c]||['#F1EFE8','#444441'];
  document.getElementById('mIcon').style.cssText=`background:${bg};color:${fg}`;
  document.getElementById('mIcon').innerHTML=`<i class="ti ${ICON[tool.c]}" aria-hidden="true"></i>`;
  document.getElementById('mName').textContent=tool.n;
  document.getElementById('mCat').textContent=CAT_LABEL[tool.c]||'';
  document.getElementById('mDesc').textContent=tool.d;
  document.getElementById('mLink').href=tool.u;
  const b=tool.b;
  document.getElementById('mBadge').innerHTML=b==='hot'?'<span class="badge b-hot" style="font-size:12px;padding:5px 10px">热门</span>':b==='new'?'<span class="badge b-new" style="font-size:12px;padding:5px 10px">新品</span>':b==='free'?'<span class="badge b-free" style="font-size:12px;padding:5px 10px">免费</span>':'';
  document.getElementById('nickInput').value='';
  document.getElementById('bodyInput').value='';
  document.getElementById('overlay').classList.add('open');
  document.getElementById('commentsList').innerHTML='<div class="comments-empty"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
  document.getElementById('commentCount').textContent='';
  const comments=await fetchComments(tool.n);
  renderComments(comments);
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  curTool=null;
}

function handleOverlayClick(e){if(e.target===document.getElementById('overlay'))closeModal();}

async function submitComment(){
  if(!curTool)return;
  const nick=document.getElementById('nickInput').value.trim();
  const body=document.getElementById('bodyInput').value.trim();
  if(!body)return;
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='发布中…';
  const ok=await saveComment(curTool.n,nick,body);
  if(ok){
    document.getElementById('bodyInput').value='';
    document.getElementById('nickInput').value='';
    const comments=await fetchComments(curTool.n);
    renderComments(comments);
  }
  btn.disabled=false;btn.textContent='发布评论';
}

const CATS2=[
  {id:'all',label:'全部',icon:'ti-apps',cls:'cat-all'},
  {id:'writing',label:'写作',icon:'ti-pencil',cls:'cat-writing'},
  {id:'image',label:'图像',icon:'ti-photo',cls:'cat-image'},
  {id:'video',label:'视频 & 音频',icon:'ti-video',cls:'cat-video'},
  {id:'code',label:'编程',icon:'ti-code',cls:'cat-code'},
  {id:'productivity',label:'效率',icon:'ti-bolt',cls:'cat-productivity'},
  {id:'search',label:'搜索',icon:'ti-world-search',cls:'cat-search'},
];

function renderCats(){
  document.getElementById('catsRow').innerHTML=CATS2.map(cat=>{
    const cnt=cat.id==='all'?TOOLS.length:TOOLS.filter(t=>t.c===cat.id).length;
    const active=curCat===cat.id?' active':'';
    return `<div class="cat ${cat.cls}${active}" onclick="setCat('${cat.id}')"><i class="ti ${cat.icon}" style="font-size:14px" aria-hidden="true"></i>${cat.label} <span style="opacity:.5;font-size:11px">${cnt}</span></div>`;
  }).join('');
}

function renderGrid(){
  const qv=q.toLowerCase();
  const list=TOOLS.filter(t=>{
    const mc=curCat==='all'||t.c===curCat;
    const mq=!qv||t.n.toLowerCase().includes(qv)||t.d.includes(qv);
    return mc&&mq;
  });
  document.getElementById('dispCount').textContent=list.length;
  document.getElementById('sectionTitle').textContent=(curCat==='all'?'全部':CAT_LABEL[curCat])+'工具';
  document.getElementById('sectionCount').textContent='共 '+list.length+' 个';
  const grid=document.getElementById('grid');
  const noRes=document.getElementById('noRes');
  if(!list.length){grid.innerHTML='';noRes.style.display='block';return;}
  noRes.style.display='none';
  grid.innerHTML=list.map((t,i)=>{
    const badge=t.b==='hot'?'<span class="badge b-hot">热门</span>':t.b==='new'?'<span class="badge b-new">新品</span>':t.b==='free'?'<span class="badge b-free">免费</span>':'';
    const sampleCnt=getSampleComments(t.n).length;
    const cntStr=sampleCnt?sampleCnt+'条评论':'评论';
    return `<div class="card" onclick="openModal(TOOLS[${TOOLS.indexOf(t)}])">
      <div class="card-header">
        <div class="icon-box icon-${t.c}"><i class="ti ${ICON[t.c]}" aria-hidden="true"></i></div>
        ${badge}
      </div>
      <div class="card-name">${t.n}</div>
      <div class="card-desc">${t.d.slice(0,38)}…</div>
      <div class="card-footer">
        <span class="card-comments"><i class="ti ti-message-circle" style="font-size:12px" aria-hidden="true"></i>${cntStr}</span>
        <span class="card-visit"><i class="ti ti-external-link" style="font-size:11px" aria-hidden="true"></i>直达</span>
      </div>
    </div>`;
  }).join('');
}

function setCat(id){curCat=id;renderCats();renderGrid();}
document.getElementById('sq').addEventListener('input',e=>{q=e.target.value;renderGrid();});
renderCats();renderGrid();
</script>

<div class="page">
  <div class="hero">
    <div class="comments-title" style="justify-content:center;margin-bottom:14px">
      <i class="ti ti-message-circle" style="font-size:16px" aria-hidden="true"></i>
      页面留言
      <span id="pageCommentCount" style="font-size:12px;color:var(--color-text-tertiary);font-weight:400"></span>
    </div>

    <div class="comment-form" style="max-width:560px;margin:0 auto 14px">
      <div class="form-row">
        <input type="text" id="pageNickInput" placeholder="昵称（可留空，默认匿名）" maxlength="20" />
      </div>
      <textarea class="comment-textarea" id="pageBodyInput" rows="3" placeholder="对网站/工具库有什么建议？欢迎留言…" maxlength="300"></textarea>
      <div class="form-bottom">
        <span class="anon-note"><i class="ti ti-shield" style="font-size:13px" aria-hidden="true"></i> 匿名可评，无需登录</span>
        <button class="btn-submit" id="pageSubmitBtn" onclick="submitPageComment()">发布留言</button>
      </div>
    </div>

    <div class="comments-list" id="pageCommentsList" style="max-width:560px;margin:0 auto"></div>
  </div>
</div>

<script>
const PAGE_THREAD_ID = '__page__ai_tools_with_comments';

function renderPageComments(list){
  const el = document.getElementById('pageCommentsList');
  document.getElementById('pageCommentCount').textContent = '(' + (list?.length || 0) + ')';
  if(!list || !list.length){
    el.innerHTML = '<div class="comments-empty"><i class="ti ti-message-off" style="font-size:20px;display:block;margin:0 auto 8px" aria-hidden="true"></i>还没有留言，来说第一个吧</div>';
    return;
  }
  el.innerHTML = list.map(c=>{
    const nick=c.nick||c.nickname||'匿名用户';
    const body=c.body||c.content||'';
    const t=timeFmt(c.time||c.created_at);
    return `<div class="comment-item">
      <div class="comment-meta">
        <div class="comment-avatar">${initials(nick)}</div>
        <span class="comment-author">${nick}</span>
        <span class="comment-time">${t}</span>
      </div>
      <div class="comment-body">${body}</div>
    </div>`;
  }).join('');
}

async function fetchPageComments(){
  const list = await fetchComments(PAGE_THREAD_ID);
  renderPageComments(list);
}

async function submitPageComment(){
  const nick=document.getElementById('pageNickInput').value.trim();
  const body=document.getElementById('pageBodyInput').value.trim();
  if(!body)return;
  const btn=document.getElementById('pageSubmitBtn');
  btn.disabled=true;btn.textContent='发布中…';
  const ok=await saveComment(PAGE_THREAD_ID,nick,body);
  if(ok){
    document.getElementById('pageBodyInput').value='';
    document.getElementById('pageNickInput').value='';
    await fetchPageComments();
  }
  btn.disabled=false;btn.textContent='发布留言';
}

fetchPageComments();
</script>
